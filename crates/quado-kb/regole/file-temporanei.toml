# File temporanei di Windows (decisioni §3): solo Impostazioni › File temporanei, mai a mano.
id = "file-temporanei"
priorita = 1
riconoscitore = "percorso"
gestore = "windows"
gestito_da = "Windows"
stato = "lo-gestisce"
azione = "procedura"
stima = "non-stimabile-procedura"
metodo = { uri = "ms-settings:storagesense" }
alternative = [{ comando = "cleanmgr" }]
rischi = 1
reversibilita = "procedura-windows"
errore = "procedura-esterna"
verifica = "dopo-procedura"
